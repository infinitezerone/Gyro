name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (host checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honors rust-toolchain.toml (stable + the two android targets) automatically.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # :core:engine's preBuild depends on cargoNdkBuild, so even pure JVM unit tests need
      # the Rust toolchain with the two android targets installed (rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          key: android-targets

      # NDK version pinned to the one used locally (29.0.14206865); cargo-ndk locates it
      # through ANDROID_NDK_HOME. Installed via sdkmanager - the runner's prebuilt
      # setup-ndk actions lag behind new NDK releases (r29 404s in nttld/setup-ndk).
      - name: Install NDK 29.0.14206865
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null'

      - name: Export NDK path for cargo-ndk
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # compileSdk 37 may not be in the runner image; licenses are pre-accepted there, so AGP
      # can fetch missing packages on demand.
      - name: Build and run all unit tests
        run: ./gradlew assembleDebug testDebugUnitTest
