org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ABIs the Rust engine is compiled for. Consumed by :core:engine (cargo-ndk targets and
# jniLibs) and by :app (abiFilters), so packaging can never advertise an ABI without a library.
gyro.nativeAbis=arm64-v8a,x86_64

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
